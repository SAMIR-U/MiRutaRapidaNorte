<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiRutaRapidaNorte · Glorieta – Green Hills</title>
<link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>
<form id="login">
  <h1>MiRutaRapidaNorte</h1>
  <p>Ingreso de busetero · Glorieta del Gobernador → Green Hills. Si es tu primera vez, se crea tu cuenta.</p>
  <input id="name" placeholder="Nombre" autocomplete="username" required>
  <input id="pw" type="password" placeholder="Contraseña (mín. 4)" autocomplete="current-password" required>
  <select id="ruta" aria-label="Ruta"><option value="2">Ruta 2</option><option value="13">Ruta 13</option><option value="22">Ruta 22</option></select>
  <div id="err" role="alert"></div>
  <button class="alt">Ingresar</button>
</form>
<div id="app" hidden>
  <header><b id="hRuta"></b><span id="hInfo"></span><button id="out" type="button">Salir</button></header>
  <svg id="map" viewBox="0 0 440 640" role="group" aria-label="Mapa de paraderos">
    <defs>
      <!-- Bus visto de frente (icono del conductor) -->
      <symbol id="busFront" viewBox="0 0 32 32">
        <rect x="1.5" y="9" width="2.5" height="6" rx="1" fill="#16242e"/>
        <rect x="28" y="9" width="2.5" height="6" rx="1" fill="#16242e"/>
        <rect x="4" y="3" width="24" height="23" rx="5" fill="#f2b705" stroke="#16242e" stroke-width="1.6"/>
        <rect x="10" y="4.6" width="12" height="2.4" rx="1.2" fill="#16242e"/>
        <rect x="7" y="9" width="18" height="9" rx="2" fill="#d8eef8" stroke="#16242e" stroke-width="1.2"/>
        <line x1="16" y1="9" x2="16" y2="18" stroke="#16242e" stroke-width="1.2"/>
        <circle cx="9.5" cy="21.5" r="2" fill="#fff" stroke="#16242e" stroke-width="1"/>
        <circle cx="22.5" cy="21.5" r="2" fill="#fff" stroke="#16242e" stroke-width="1"/>
        <rect x="3" y="24.5" width="26" height="3" rx="1.5" fill="#16242e"/>
        <rect x="7" y="27" width="5" height="3.5" rx="1" fill="#16242e"/>
        <rect x="20" y="27" width="5" height="3.5" rx="1" fill="#16242e"/>
      </symbol>
    </defs>
    <g id="scene"></g>
  </svg>
  <section id="panel"></section>
</div>
<script src="/src/js/app.js"></script>
</body>
</html>
